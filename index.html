<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hhh-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- ── PWA (installable app) ──────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HappyHomesHub" />
    <link rel="apple-touch-icon" href="/hhh-icon.svg" />

    <!-- ── Primary SEO ─────────────────────────────────────────────────────── -->
    <title>HappyHomesHub — Property Management Software for Landlords &amp; Tenants</title>
    <meta name="description" content="HappyHomesHub is free property management software for landlords, tenants, and handymen. Track rent payments, maintenance requests, leases, and expenses — all in one place. First property free." />
    <meta name="keywords" content="property management software, landlord software, tenant portal, rent tracking, maintenance request tracking, online rent collection, property management app, free landlord software, rental property management, tenant management system, lease management, maintenance management, handyman job board, rental income tracker, property expense tracker" />
    <meta name="author" content="HappyHomesHub" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://happyhomeshub.com/" />
    <meta name="theme-color" content="#0D1F2D" />

    <!-- ── Open Graph / Facebook ──────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://happyhomeshub.com/" />
    <meta property="og:title" content="HappyHomesHub — Free Property Management Software" />
    <meta property="og:description" content="Manage rent, repairs, tenants, documents, and handymen in one platform. Free for your first property — no credit card required." />
    <meta property="og:image" content="https://happyhomeshub.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="HappyHomesHub" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@happyhomeshub" />
    <meta name="twitter:title" content="HappyHomesHub — Free Property Management Software" />
    <meta name="twitter:description" content="Manage rent, repairs, tenants, documents, and handymen in one platform. First property free forever." />
    <meta name="twitter:image" content="https://happyhomeshub.com/og-image.png" />

    <!-- ── Structured Data (JSON-LD) ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "HappyHomesHub",
          "url": "https://happyhomeshub.com",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "Property management software for landlords, tenants, and handymen. Track rent, maintenance, leases, and expenses in one place.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Home plan free forever for your first property. Portfolio plan $20/month for a 2nd property, then $10/month per additional property — unlimited properties, fee-free bank rent, and SMS alerts."
          },
          "featureList": [
            "Rent tracking and payment history",
            "Maintenance request management",
            "Tenant onboarding and invitations",
            "Lease and document management",
            "Expense tracking",
            "Handyman job board",
            "Landlord-tenant messaging",
            "Property inspection reports"
          ],
          "screenshot": "https://happyhomeshub.com/og-image.png"
        },
        {
          "@type": "Organization",
          "name": "HappyHomesHub",
          "url": "https://happyhomeshub.com",
          "logo": "https://happyhomeshub.com/hhh-icon.svg",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@happyhomeshub.com",
            "contactType": "customer support"
          }
        },
        {
          "@type": "WebSite",
          "name": "HappyHomesHub",
          "url": "https://happyhomeshub.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://happyhomeshub.com/signup",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is HappyHomesHub free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes — your first property is free forever on the Home plan. The Portfolio plan adds a 2nd property for $20/month, then $10/month for each additional property, and unlocks fee-free bank rent collection and SMS alerts."
              }
            },
            {
              "@type": "Question",
              "name": "What can landlords do on HappyHomesHub?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Landlords can track rent payments, manage maintenance requests, invite tenants, upload lease documents, track expenses, and communicate with tenants and handymen."
              }
            },
            {
              "@type": "Question",
              "name": "Can tenants pay rent online?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Tenants can pay rent online by card or bank transfer, which is deposited directly to the landlord, and download a receipt for every payment. They can also report payments made by cash or check."
              }
            },
            {
              "@type": "Question",
              "name": "Does HappyHomesHub have a handyman marketplace?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Landlords can browse verified handymen, view their skills and service areas, and send maintenance jobs directly. Handymen get paid in-app — the landlord pays the accepted quote and funds are deposited straight to the handyman's bank."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- ── Preconnect / Performance ───────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ── Google Analytics ───────────────────────────────────────────────── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5S47WTV6YL"></script>
    <script src="/ga.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
